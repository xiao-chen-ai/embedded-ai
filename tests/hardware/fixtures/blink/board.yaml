# Embedded AI Studio 规范板级描述（board.yaml）
# 用途：把 PCB 原理图连线（网表）交给 AI，作为固件代码生成的硬件事实来源。
board: blink-board
mcu:
  ref: U1
  part: STM32F103C8T6
  package: LQFP48

components:
  - ref: D1
    type: led
    value: power-green
    pins:
      anode: 3V3
      cathode: PA5
  - ref: D2
    type: led
    value: status-blue
    pins:
      anode: PB0
      cathode: GND
  - ref: SW1
    type: button
    value: user-button
    pins:
      a: PA0
      b: GND
  - ref: U2
    type: sensor
    value: BMP280
    pins:
      VCC: 3V3
      GND: GND
      SDA: I2C1_SDA
      SCL: I2C1_SCL
  - ref: U3
    type: regulator
    value: AMS1117-3.3
    pins:
      VIN: 5V
      GND: GND
      VOUT: 3V3
  - ref: Y1
    type: crystal
    value: 8MHz
    pins:
      a: OSC_IN
      b: OSC_OUT
  - ref: C1
    type: capacitor
    value: 100n
    pins:
      "1": 3V3
      "2": GND
  - ref: C2
    type: capacitor
    value: 100n
    pins:
      "1": 3V3
      "2": GND
  - ref: C3
    type: capacitor
    value: 100n
    pins:
      "1": GND
      "2": 3V3
  - ref: C4
    type: capacitor
    value: 100n
    pins:
      "1": 3V3
      "2": GND

nets:
  - name: I2C1_SDA
    comment: 传感器 I2C 总线数据线
    pins:
      - U1.PB9
      - U2.SDA
  - name: I2C1_SCL
    comment: 传感器 I2C 总线时钟线
    pins:
      - U1.PB8
      - U2.SCL
  - name: OSC_IN
    pins:
      - U1.PD0
      - Y1.a
  - name: OSC_OUT
    pins:
      - U1.PD1
      - Y1.b
